version: 2
updates:
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker-compose
    directories: ['/deploy/images', '/deploy/package/components', '/deploy/package/proxies']
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/setup-node']
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /src/ShutterSpool.Web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-compatible:
        patterns: ['*']
        update-types: [minor]
      npm-patch:
        patterns: ['*']
        update-types: [patch]
      npm-major:
        patterns: ['*']
        update-types: [major]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directories: ['/', '/.github']
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      nuget-compatible:
        patterns: ['*']
        update-types: [minor]
      nuget-patch:
        patterns: ['*']
        update-types: [patch]
      nuget-major:
        patterns: ['*']
        update-types: [major]
      nuget-security:
        applies-to: security-updates
        patterns: ['*']

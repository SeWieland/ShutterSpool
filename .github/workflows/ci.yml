name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      coverage-artifact-id: ${{ steps.coverage.outputs.artifact-id }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: controlled-ci-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      SHUTTERSPOOL_REQUIRE_POSTGRES_TESTS: "true"
      SHUTTERSPOOL_INGEST_TEST_CONNECTION: "Host=localhost;Port=5432;Username=postgres;Database=postgres;Password=controlled-ci-password"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/ShutterSpool.Web/package.json
          cache: npm
          cache-dependency-path: src/ShutterSpool.Web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: src/ShutterSpool.Web
      - name: Check frontend types
        run: npm run typecheck
        working-directory: src/ShutterSpool.Web
      - name: Test frontend
        id: frontend-tests
        continue-on-error: true
        run: |
          # shortcut: Unnamed VM scripts cannot map to Vue/TS sources, add source mapping when expanding frontend coverage.
          npm exec --yes --package=c8@10.1.3 -- c8 --reporter=lcovonly --include 'app/**' \
            --reports-dir="$RUNNER_TEMP/ci-coverage" npm test
        working-directory: src/ShutterSpool.Web
      - name: Build frontend
        run: npm run build
        working-directory: src/ShutterSpool.Web
      - name: Test camera FTP client security
        run: python tests/verify-camera-ftp-client.py
      - name: Test Compose packaging
        run: python tests/verify-release-build.py
      - name: Test shared container image pins
        run: python tests/verify-image-pins.py
      - name: Test supplied camera certificate validation
        run: python tests/verify-edge-startup.py
      - name: Restore core tests
        run: dotnet restore tests/ShutterSpool.Core.Tests/ShutterSpool.Core.Tests.csproj --locked-mode
      - name: Restore integration tests
        run: dotnet restore tests/ShutterSpool.IntegrationTests/ShutterSpool.IntegrationTests.csproj --locked-mode
      - name: Restore architecture tests
        run: dotnet restore tests/ShutterSpool.ArchitectureTests/ShutterSpool.ArchitectureTests.csproj --locked-mode
      - name: Restore AppHost
        run: dotnet restore src/ShutterSpool.AppHost/ShutterSpool.AppHost.csproj --locked-mode
      - name: Build solution
        run: dotnet build --no-restore
      - name: Install .NET coverage collector
        run: dotnet tool install dotnet-coverage --version 18.12.0 --allow-roll-forward --tool-path "$RUNNER_TEMP/coverage-tools"
      - name: Test solution
        id: tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci" "$RUNNER_TEMP/ci-coverage"
          "$RUNNER_TEMP/coverage-tools/dotnet-coverage" collect -f xml -o "$RUNNER_TEMP/ci-coverage/dotnet.xml" -- \
            bash -c 'dotnet test --no-build && touch "$RUNNER_TEMP/ci/dotnet-tests-passed"' \
            2>&1 | tee "$RUNNER_TEMP/ci/dotnet-tests.log"
          test -f "$RUNNER_TEMP/ci/dotnet-tests-passed"
      - name: Fail CI if frontend tests failed
        if: ${{ !cancelled() && steps.frontend-tests.outcome == 'failure' }}
        run: exit 1
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Check for missing database migrations
        run: |
          dotnet ef migrations has-pending-model-changes --project src/ShutterSpool.Infrastructure --startup-project src/ShutterSpool.Infrastructure --context ShutterSpoolDbContext --no-build
          dotnet ef migrations has-pending-model-changes --project src/ShutterSpool.Infrastructure --startup-project src/ShutterSpool.Infrastructure --context WorkspaceControlDbContext --no-build
      - name: Generate API client
        run: npm run generate-client
        working-directory: src/ShutterSpool.Web
      - name: Verify generated API files are current
        run: |
          if [ -n "$(git status --porcelain -- src/ShutterSpool.Server/openapi src/ShutterSpool.Web/app/api)" ]; then
            git status --short -- src/ShutterSpool.Server/openapi src/ShutterSpool.Web/app/api
            git diff -- src/ShutterSpool.Server/openapi src/ShutterSpool.Web/app/api
            exit 1
          fi
      - name: Upload failed test output
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-test-output
          path: ${{ runner.temp }}/ci/dotnet-tests.log
          retention-days: 7
      - name: Upload coverage reports
        id: coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage
          path: |
            ${{ runner.temp }}/ci-coverage/dotnet.xml
            ${{ runner.temp }}/ci-coverage/lcov.info
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  analyze:
    name: SonarQube analysis
    needs: verify
    # Fork and Dependabot pull requests do not receive the analysis credential.
    if: >-
      !cancelled() && vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Check analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Set the SONAR_TOKEN Actions secret before enabling SonarQube analysis.'
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/ShutterSpool.Web/package.json
          cache: npm
          cache-dependency-path: src/ShutterSpool.Web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: src/ShutterSpool.Web
      - name: Prepare frontend types
        run: npm run typecheck
        working-directory: src/ShutterSpool.Web
      - name: Install SonarScanner
        run: dotnet tool install dotnet-sonarscanner --version 12.1.0 --tool-path "$RUNNER_TEMP/sonar"
      - name: Restore solution
        run: dotnet restore ShutterSpool.slnx --locked-mode
      - name: Download coverage reports
        if: needs.verify.outputs.coverage-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.coverage-artifact-id }}
          path: ${{ runner.temp }}/ci-coverage
      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          coverage_args=()
          dotnet_report="$RUNNER_TEMP/ci-coverage/dotnet.xml"
          frontend_report="$RUNNER_TEMP/ci-coverage/lcov.info"
          if [ -s "$dotnet_report" ]; then
            coverage_args+=("/d:sonar.cs.vscoveragexml.reportsPaths=$dotnet_report")
          else
            echo '::warning::.NET coverage report missing. SonarQube coverage will be incomplete.'
          fi
          if [ -s "$frontend_report" ]; then
            sed -i 's|^SF:app/|SF:src/ShutterSpool.Web/app/|' "$frontend_report"
            coverage_args+=("/d:sonar.javascript.lcov.reportPaths=$frontend_report")
          else
            echo '::warning::Frontend coverage report missing. SonarQube coverage will be incomplete.'
          fi
          # The PostgreSQL bootstrap script uses psql syntax outside Sonar's Oracle PL/SQL dialect.
          "$RUNNER_TEMP/sonar/dotnet-sonarscanner" begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.projectBaseDir="$GITHUB_WORKSPACE" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.python.version=3.10,3.11,3.12 \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/node_modules/**,**/.nuxt/**,**/.output/**,**/dist/**,.nuget/**,artifacts/**,**/TestResults/**,**/coverage/**,src/ShutterSpool.Web/app/api/**,src/ShutterSpool.Server/openapi/**,src/ShutterSpool.Server/wwwroot/**,deploy/package/workspace-databases.sql" \
            "${coverage_args[@]}"
      - name: Build for analysis
        run: dotnet build ShutterSpool.slnx --no-restore --no-incremental --disable-build-servers
      - name: Upload analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: '"$RUNNER_TEMP/sonar/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"'

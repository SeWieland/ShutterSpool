name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      coverage-artifact-id: ${{ steps.coverage.outputs.artifact-id }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      SHUTTERSPOOL_REQUIRE_POSTGRES_TESTS: "true"
      SHUTTERSPOOL_INGEST_TEST_CONNECTION: "Host=localhost;Port=5432;Username=postgres;Database=postgres;Password=controlled-ci-password"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the packaged PostgreSQL version
        env:
          POSTGRES_PASSWORD: controlled-ci-password
        run: |
          image=$(docker compose -p ci -f deploy/package/components/compose.postgres.yaml config --no-consistency --images postgres)
          docker run --detach --name ci-postgres --publish 127.0.0.1:5432:5432 --env POSTGRES_PASSWORD "$image"
          timeout 60 bash -c 'until docker exec ci-postgres pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done'
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      - name: Install frontend dependencies
        run: |
          npm install --global --ignore-scripts "npm@$(node -p 'require("./package.json").engines.npm')"
          npm ci --engine-strict --ignore-scripts
        working-directory: src/ShutterSpool.Web
      - name: Check frontend types
        run: npm run typecheck
        working-directory: src/ShutterSpool.Web
      - name: Test frontend
        id: frontend-tests
        continue-on-error: true
        run: |
          test_status=0
          npm test -- --coverage --coverage.reportsDirectory="$RUNNER_TEMP/vitest-coverage" || test_status=$?
          mkdir -p "$RUNNER_TEMP/ci-coverage"
          report="$RUNNER_TEMP/vitest-coverage/lcov.info"
          if [ -s "$report" ]; then
            sed -E 's@^SF:(app|scripts)/@SF:src/ShutterSpool.Web/\1/@' "$report" > "$RUNNER_TEMP/ci-coverage/lcov.info"
          fi
          exit "$test_status"
        working-directory: src/ShutterSpool.Web
      - name: Build frontend
        run: npm run build
        working-directory: src/ShutterSpool.Web
      - name: Test camera FTP client security
        run: python tests/verify-camera-ftp-client.py
      - name: Test NuGet notice collection
        run: python tests/verify-dotnet-notices.py
      - name: Test Compose packaging
        env:
          COVERAGE_FILE: ${{ runner.temp }}/package-tests.coverage
          PYTHONPATH: ${{ runner.temp }}/package-coverage
        run: |
          python -m pip install --only-binary :all: --require-hashes --target "$PYTHONPATH" -r tests/requirements.txt
          test_status=0
          python -m coverage run --include='tools/*.py' tests/verify-release-build.py || test_status=$?
          if [ -s "$COVERAGE_FILE" ]; then
            python -m coverage xml -o "$RUNNER_TEMP/ci-coverage/python.xml"
          fi
          exit "$test_status"
      - name: Test shared container image pins
        run: python tests/verify-image-pins.py
      - name: Test supplied camera certificate validation
        run: python tests/verify-edge-startup.py
      - name: Restore core tests
        run: dotnet restore tests/ShutterSpool.Core.Tests/ShutterSpool.Core.Tests.csproj --locked-mode
      - name: Restore integration tests
        run: dotnet restore tests/ShutterSpool.IntegrationTests/ShutterSpool.IntegrationTests.csproj --locked-mode
      - name: Restore architecture tests
        run: dotnet restore tests/ShutterSpool.ArchitectureTests/ShutterSpool.ArchitectureTests.csproj --locked-mode
      - name: Restore AppHost
        run: dotnet restore src/ShutterSpool.AppHost/ShutterSpool.AppHost.csproj --locked-mode
      - name: Build solution
        run: dotnet build --no-restore
      - name: Check the Server's NuGet notices
        run: |
          deps=$(dotnet msbuild src/ShutterSpool.Server/ShutterSpool.Server.csproj -nologo -getProperty:ProjectDepsFilePath)
          dotnet run --file tools/collect-dotnet-notices.cs -- "$deps" "$NUGET_PACKAGES" tools/dotnet-notices "$RUNNER_TEMP/dotnet-notices"
      - name: Install .NET coverage collector
        run: |
          version=$(jq -er '.tools["dotnet-coverage"].version' .github/.config/dotnet-tools.json)
          dotnet tool install dotnet-coverage --version "$version" --allow-roll-forward --tool-path "$RUNNER_TEMP/coverage-tools"
      - name: Test solution
        id: tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci" "$RUNNER_TEMP/ci-coverage"
          "$RUNNER_TEMP/coverage-tools/dotnet-coverage" collect -f xml -o "$RUNNER_TEMP/ci-coverage/dotnet.xml" -- \
            bash -c 'dotnet test --no-build && touch "$RUNNER_TEMP/ci/dotnet-tests-passed"' \
            2>&1 | tee "$RUNNER_TEMP/ci/dotnet-tests.log"
          test -f "$RUNNER_TEMP/ci/dotnet-tests-passed"
      - name: Fail CI if frontend tests failed
        if: ${{ !cancelled() && steps.frontend-tests.outcome == 'failure' }}
        run: exit 1
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Check for missing database migrations
        run: |
          dotnet ef migrations has-pending-model-changes --project src/ShutterSpool.Infrastructure --startup-project src/ShutterSpool.Infrastructure --context ShutterSpoolDbContext --no-build
          dotnet ef migrations has-pending-model-changes --project src/ShutterSpool.Infrastructure --startup-project src/ShutterSpool.Infrastructure --context WorkspaceControlDbContext --no-build
      - name: Generate API client
        run: npm run generate-client
        working-directory: src/ShutterSpool.Web
      - name: Verify generated API files are current
        run: |
          if [ -n "$(git status --porcelain -- src/ShutterSpool.Server/openapi src/ShutterSpool.Web/app/api)" ]; then
            git status --short -- src/ShutterSpool.Server/openapi src/ShutterSpool.Web/app/api
            git diff -- src/ShutterSpool.Server/openapi src/ShutterSpool.Web/app/api
            exit 1
          fi
      - name: Upload failed test output
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-test-output
          path: ${{ runner.temp }}/ci/dotnet-tests.log
          retention-days: 7
      - name: Upload coverage reports
        id: coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage
          path: |
            ${{ runner.temp }}/ci-coverage/dotnet.xml
            ${{ runner.temp }}/ci-coverage/lcov.info
            ${{ runner.temp }}/ci-coverage/python.xml
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  analyze:
    name: SonarQube analysis
    needs: verify
    # Fork and Dependabot pull requests do not receive the analysis credential.
    if: >-
      !cancelled() && vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Check analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Set the SONAR_TOKEN Actions secret before enabling SonarQube analysis.'
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      - name: Install frontend dependencies
        run: |
          npm install --global --ignore-scripts "npm@$(node -p 'require("./package.json").engines.npm')"
          npm ci --engine-strict --ignore-scripts
        working-directory: src/ShutterSpool.Web
      - name: Prepare frontend types
        run: npm run typecheck
        working-directory: src/ShutterSpool.Web
      - name: Install SonarScanner
        run: |
          version=$(jq -er '.tools["dotnet-sonarscanner"].version' .github/.config/dotnet-tools.json)
          dotnet tool install dotnet-sonarscanner --version "$version" --tool-path "$RUNNER_TEMP/sonar"
      - name: Restore solution
        run: dotnet restore ShutterSpool.slnx --locked-mode
      - name: Download coverage reports
        if: needs.verify.outputs.coverage-artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.coverage-artifact-id }}
          path: ${{ runner.temp }}/ci-coverage
      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          coverage_args=()
          dotnet_report="$RUNNER_TEMP/ci-coverage/dotnet.xml"
          if [ -s "$dotnet_report" ]; then
            coverage_args+=("/d:sonar.cs.vscoveragexml.reportsPaths=$dotnet_report")
          else
            echo '::warning::.NET coverage report missing. SonarQube coverage will be incomplete.'
          fi
          frontend_report="$RUNNER_TEMP/ci-coverage/lcov.info"
          if [ -s "$frontend_report" ]; then
            coverage_args+=("/d:sonar.javascript.lcov.reportPaths=$frontend_report")
          else
            echo '::warning::Frontend coverage report missing. SonarQube coverage will be incomplete.'
          fi
          python_report="$RUNNER_TEMP/ci-coverage/python.xml"
          if [ -s "$python_report" ]; then
            coverage_args+=("/d:sonar.python.coverage.reportPaths=$python_report")
          else
            echo '::warning::Python coverage report missing. SonarQube coverage will be incomplete.'
          fi
          # The scanner classifies shared Vitest fixtures and standalone Python test scripts as source.
          # Keep them in static analysis and out of production coverage.
          # The PostgreSQL bootstrap script uses psql syntax outside Sonar's Oracle PL/SQL dialect.
          "$RUNNER_TEMP/sonar/dotnet-sonarscanner" begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.projectBaseDir="$GITHUB_WORKSPACE" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.python.version=3.10,3.11,3.12 \
            /d:sonar.coverage.exclusions="src/ShutterSpool.Web/tests/**,tests/**/*.py" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/node_modules/**,**/.nuxt/**,**/.output/**,**/dist/**,.nuget/**,artifacts/**,**/TestResults/**,**/coverage/**,src/ShutterSpool.Web/app/api/**,src/ShutterSpool.Server/openapi/**,src/ShutterSpool.Server/wwwroot/**,deploy/package/workspace-databases.sql" \
            "${coverage_args[@]}"
      - name: Build for analysis
        run: dotnet build ShutterSpool.slnx --no-restore --no-incremental --disable-build-servers
      - name: Upload analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: '"$RUNNER_TEMP/sonar/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"'

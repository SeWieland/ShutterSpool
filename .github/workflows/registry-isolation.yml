name: GHCR staging isolation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Create synthetic test objects, or check a prior run after configuring package access
        required: true
        type: choice
        options: [create, check]
      confirm_synthetic_only:
        description: Confirm this run uses synthetic probe objects only
        required: true
        type: boolean
      probe_run_id:
        description: Run ID from the earlier create run (check mode only)
        required: false
        type: string
      probe_run_attempt:
        description: Run attempt from the earlier create run (check mode only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  create:
    if: github.repository == 'SeWieland/ShutterSpool' && github.ref == 'refs/heads/main' && inputs.mode == 'create' && inputs.confirm_synthetic_only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.probe.outputs.image_tag }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
      bundle_tag: ${{ steps.probe.outputs.bundle_tag }}
      bundle_digest: ${{ steps.publish.outputs.bundle_digest }}
      compose_sha256: ${{ steps.probe.outputs.compose_sha256 }}
      manifest_sha256: ${{ steps.probe.outputs.manifest_sha256 }}
    steps:
      - name: Check out probe generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
          checksum: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
      - name: Create synthetic OCI objects
        id: probe
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OUTPUT_DIR: ${{ runner.temp }}/ghcr-isolation-probe
        run: python tools/registry-isolation.py create --output "$OUTPUT_DIR" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR with this workflow token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish synthetic objects only
        id: publish
        env:
          GHCR_PACKAGE: ghcr.io/sewieland/shutterspool-candidates
          IMAGE_TAG: ${{ steps.probe.outputs.image_tag }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.probe.outputs.image_digest }}
          BUNDLE_TAG: ${{ steps.probe.outputs.bundle_tag }}
          IMAGE_LAYOUT: ${{ runner.temp }}/ghcr-isolation-probe/image-layout
        working-directory: ${{ runner.temp }}/ghcr-isolation-probe
        shell: bash
        run: |
          set -euo pipefail
          image_digest="$(oras cp --from-oci-layout "$IMAGE_LAYOUT:$IMAGE_TAG" "$GHCR_PACKAGE:$IMAGE_TAG" >/dev/null && oras resolve "$GHCR_PACKAGE:$IMAGE_TAG")"
          bundle_result="$(oras push --artifact-type application/vnd.shutterspool.synthetic.registry-probe "$GHCR_PACKAGE:$BUNDLE_TAG" compose.yaml:application/yaml manifest.json:application/json --format go-template='{{.digest}}')"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$image_digest" = "$EXPECTED_IMAGE_DIGEST"
          [[ "$bundle_result" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "bundle_digest=$bundle_result" >> "$GITHUB_OUTPUT"
      - name: Verify authorized retrieval and exact content
        env:
          GHCR_PACKAGE: ghcr.io/sewieland/shutterspool-candidates
          IMAGE_TAG: ${{ steps.probe.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.image_digest }}
          BUNDLE_DIGEST: ${{ steps.publish.outputs.bundle_digest }}
          EXPECTED_COMPOSE: ${{ steps.probe.outputs.compose_sha256 }}
          EXPECTED_MANIFEST: ${{ steps.probe.outputs.manifest_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/authorized-probe
        shell: bash
        run: |
          set -euo pipefail
          actual_image="$(oras manifest fetch --format go-template --template='{{.digest}}' "$GHCR_PACKAGE@$IMAGE_DIGEST")"
          test "$actual_image" = "$IMAGE_DIGEST"
          oras pull --output "$OUTPUT_DIR" "$GHCR_PACKAGE@$BUNDLE_DIGEST"
          test "$(sha256sum "$OUTPUT_DIR/compose.yaml" | cut -d' ' -f1)" = "$EXPECTED_COMPOSE"
          test "$(sha256sum "$OUTPUT_DIR/manifest.json" | cut -d' ' -f1)" = "$EXPECTED_MANIFEST"
          {
            printf '### Synthetic probe objects created\n'
            printf 'Run ID: %s (attempt %s)\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Image: `%s@%s`\n' "$IMAGE_TAG" "$IMAGE_DIGEST"
            printf 'Bundle: `%s@%s`\n' "$GHCR_PACKAGE" "$BUNDLE_DIGEST"
            printf 'compose.yaml SHA-256: `%s`\n' "$EXPECTED_COMPOSE"
            printf 'manifest.json SHA-256: `%s`\n' "$EXPECTED_MANIFEST"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Authorized retrieval matched the synthetic image digest and both bundle file hashes."

  authorized-check:
    if: github.repository == 'SeWieland/ShutterSpool' && github.ref == 'refs/heads/main' && inputs.mode == 'check' && inputs.confirm_synthetic_only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image_tag: ${{ steps.verify.outputs.image_tag }}
      image_digest: ${{ steps.verify.outputs.image_digest }}
      bundle_tag: ${{ steps.verify.outputs.bundle_tag }}
      bundle_digest: ${{ steps.verify.outputs.bundle_digest }}
    env:
      PROBE_RUN_ID: ${{ inputs.probe_run_id }}
      PROBE_RUN_ATTEMPT: ${{ inputs.probe_run_attempt }}
    steps:
      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
          checksum: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
      - name: Check out denial verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recreate the prior synthetic fixture
        id: probe
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ghcr-isolation-probe
        shell: bash
        run: |
          set -euo pipefail
          python tools/registry-isolation.py create --output "$OUTPUT_DIR" --run-id "$PROBE_RUN_ID" --run-attempt "$PROBE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR with read-only workflow token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Verify current authorized objects and hashes
        id: verify
        env:
          GHCR_PACKAGE: ghcr.io/sewieland/shutterspool-candidates
          IMAGE_TAG: ${{ steps.probe.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.probe.outputs.image_digest }}
          BUNDLE_TAG: ${{ steps.probe.outputs.bundle_tag }}
          EXPECTED_COMPOSE: ${{ steps.probe.outputs.compose_sha256 }}
          EXPECTED_MANIFEST: ${{ steps.probe.outputs.manifest_sha256 }}
          OUTPUT_DIR: ${{ runner.temp }}/authorized-probe
        shell: bash
        run: |
          set -euo pipefail
          # Resolve the old tag first, then fetch by the proven digest below.
          bundle_digest="$(oras resolve "$GHCR_PACKAGE:$BUNDLE_TAG")"
          [[ "$bundle_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_digest="$(oras resolve "$GHCR_PACKAGE:$IMAGE_TAG")"
          test "$image_digest" = "$IMAGE_DIGEST"
          test "$(oras manifest fetch --format go-template --template='{{.digest}}' "$GHCR_PACKAGE@$IMAGE_DIGEST")" = "$IMAGE_DIGEST"
          oras pull --output "$OUTPUT_DIR" "$GHCR_PACKAGE@$bundle_digest"
          test "$(sha256sum "$OUTPUT_DIR/compose.yaml" | cut -d' ' -f1)" = "$EXPECTED_COMPOSE"
          test "$(sha256sum "$OUTPUT_DIR/manifest.json" | cut -d' ' -f1)" = "$EXPECTED_MANIFEST"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "bundle_tag=$BUNDLE_TAG" >> "$GITHUB_OUTPUT"
          echo "bundle_digest=$bundle_digest" >> "$GITHUB_OUTPUT"

  anonymous-check:
    if: github.repository == 'SeWieland/ShutterSpool' && github.ref == 'refs/heads/main' && inputs.mode == 'check' && inputs.confirm_synthetic_only
    needs: [authorized-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
          checksum: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
      - name: Check out denial verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm anonymous image access is denied
        env:
          GHCR_PACKAGE: ghcr.io/sewieland/shutterspool-candidates
          IMAGE_DIGEST: ${{ needs.authorized-check.outputs.image_digest }}
          ORAS_CONFIG: ${{ runner.temp }}/oras-anonymous.json
        run: python tools/registry-isolation.py verify-denial -- oras --registry-config "$ORAS_CONFIG" manifest fetch "$GHCR_PACKAGE@$IMAGE_DIGEST" --format json
      - name: Confirm anonymous bundle access is denied
        env:
          GHCR_PACKAGE: ghcr.io/sewieland/shutterspool-candidates
          BUNDLE_DIGEST: ${{ needs.authorized-check.outputs.bundle_digest }}
          ORAS_CONFIG: ${{ runner.temp }}/oras-anonymous.json
        run: python tools/registry-isolation.py verify-denial -- oras --registry-config "$ORAS_CONFIG" pull "$GHCR_PACKAGE@$BUNDLE_DIGEST"
      - name: Check whether GHCR accepts the package-permission-absent workflow token
        id: token-login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          ORAS_CONFIG: ${{ runner.temp }}/oras-limited-token.json
        run: python tools/registry-isolation.py verify-token-login -- oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin --registry-config "$ORAS_CONFIG" <<< "$GH_TOKEN"
      - name: Confirm the package-permission-absent token cannot read the image
        if: steps.token-login.outputs.available == 'true'
        env:
          GHCR_PACKAGE: ghcr.io/sewieland/shutterspool-candidates
          IMAGE_DIGEST: ${{ needs.authorized-check.outputs.image_digest }}
          ORAS_CONFIG: ${{ runner.temp }}/oras-limited-token.json
        run: python tools/registry-isolation.py verify-denial -- oras --registry-config "$ORAS_CONFIG" manifest fetch "$GHCR_PACKAGE@$IMAGE_DIGEST" --format json
      - name: Confirm the package-permission-absent token cannot read the bundle
        if: steps.token-login.outputs.available == 'true'
        env:
          GHCR_PACKAGE: ghcr.io/sewieland/shutterspool-candidates
          BUNDLE_DIGEST: ${{ needs.authorized-check.outputs.bundle_digest }}
          ORAS_CONFIG: ${{ runner.temp }}/oras-limited-token.json
        run: python tools/registry-isolation.py verify-denial -- oras --registry-config "$ORAS_CONFIG" pull "$GHCR_PACKAGE@$BUNDLE_DIGEST"
      - name: Record when GHCR rejects the limited-scope token at login
        if: steps.token-login.outputs.available == 'false'
        run: |
          printf 'Authenticated negative control unavailable: GHCR rejected the token during login before package access could be tested.\n' >> "$GITHUB_STEP_SUMMARY"

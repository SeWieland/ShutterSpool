name: Promote approved container candidate

on:
  workflow_dispatch:
    inputs:
      bundle_digest:
        description: Qualified private Compose bundle sha256 digest from the staging run
        required: true
        type: string
      notes_sha256:
        description: SHA-256 of the reviewed release notes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ghcr-publication
  cancel-in-progress: false

env:
  STAGING: ghcr.io/sewieland/shutterspool-candidates
  PUBLIC: ghcr.io/sewieland/shutterspool
  BUNDLE: ${{ inputs.bundle_digest }}
  NOTES: ${{ inputs.notes_sha256 }}

jobs:
  identify:
    if: github.repository == 'SeWieland/ShutterSpool' && github.ref == 'refs/heads/main' && vars.GHCR_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: read
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.candidate.outputs.commit }}
      image: ${{ steps.candidate.outputs.image }}
    steps:
      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
          checksum: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
      - name: Identify immutable candidate for approval
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$BUNDLE" =~ ^sha256:[0-9a-f]{64}$ && "$NOTES" =~ ^[0-9a-f]{64}$ ]]
          test "$(gh api /user/packages/container/shutterspool-candidates --jq .visibility)" = private
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$ACTOR" --password-stdin
          manifest=$(oras manifest fetch "$STAGING@$BUNDLE")
          test "$(jq -er '.artifactType' <<< "$manifest")" = application/vnd.shutterspool.release.bundle
          version=$(jq -er '.annotations["org.opencontainers.image.version"]' <<< "$manifest")
          commit=$(jq -er '.annotations["org.opencontainers.image.revision"]' <<< "$manifest")
          image=$(jq -er '.annotations["io.shutterspool.image.digest"]' <<< "$manifest")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ && "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(oras resolve "$STAGING@$image")" = "$image"
          printf 'version=%s\ncommit=%s\nimage=%s\n' "$version" "$commit" "$image" >> "$GITHUB_OUTPUT"
          {
            printf '### Approval required\n\nVersion: `%s`\nSource: `%s`\nNotes SHA-256: `%s`\n' "$version" "$commit" "$NOTES"
            printf 'Copy image `%s` to `%s:%s`\n' "$image" "$PUBLIC" "$version"
            printf 'Copy bundle `%s` to `%s:bundle-%s`\n' "$BUNDLE" "$PUBLIC" "$version"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: identify
    if: github.repository == 'SeWieland/ShutterSpool' && github.ref == 'refs/heads/main' && vars.GHCR_PUBLISHING_ENABLED == 'true'
    name: Approve ${{ needs.identify.outputs.version }} from ${{ needs.identify.outputs.commit }} image ${{ needs.identify.outputs.image }} bundle ${{ inputs.bundle_digest }} notes ${{ inputs.notes_sha256 }}
    environment: ghcr-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.identify.outputs.version }}
      IMAGE: ${{ needs.identify.outputs.image }}
    steps:
      - name: Check out publication command
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
          checksum: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
      - name: Copy the approved digests without replacing versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test "$(gh api /user/packages/container/shutterspool-candidates --jq .visibility)" = private
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$ACTOR" --password-stdin
          test "$(oras resolve "$STAGING@$IMAGE")" = "$IMAGE"
          test "$(oras resolve "$STAGING@$BUNDLE")" = "$BUNDLE"
          bash tools/promote-container.sh "$STAGING" "$PUBLIC" "$VERSION" "$IMAGE" "$BUNDLE"
          # First publication may need the maintainer to set package visibility, then retry.
          test "$(gh api /user/packages/container/shutterspool --jq .visibility)" = public
      - name: Verify anonymous retrieval
        run: |
          set -euo pipefail
          printf '{}' > "$RUNNER_TEMP/anonymous.json"
          oras cp --registry-config "$RUNNER_TEMP/anonymous.json" --to-oci-layout "$PUBLIC@$IMAGE" "$RUNNER_TEMP/public-image:verified"
          oras pull --registry-config "$RUNNER_TEMP/anonymous.json" --output "$RUNNER_TEMP/public-bundle" "$PUBLIC@$BUNDLE"
          printf 'Published and retrieved anonymously: `%s:%s@%s` and bundle `%s`.\n' "$PUBLIC" "$VERSION" "$IMAGE" "$BUNDLE" >> "$GITHUB_STEP_SUMMARY"

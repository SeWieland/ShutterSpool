name: Stage private container candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Explicit SemVer prerelease candidate version
        required: true
        type: string
      revision:
        description: Exact 40-character source commit on main
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage:
    if: github.repository == 'SeWieland/ShutterSpool' && github.ref == 'refs/heads/main' && vars.GHCR_CANDIDATE_STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      BUILD_REVISION: ${{ inputs.revision }}
      BUILD_VERSION: ${{ inputs.version }}
      PACKAGE: ghcr.io/sewieland/shutterspool-candidates
    steps:
      - name: Validate source input
        run: '[[ "$BUILD_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - name: Require source on main and private staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git merge-base --is-ancestor "$BUILD_REVISION" origin/main
          test "$(gh api /user/packages/container/shutterspool-candidates --jq .visibility)" = private
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/ShutterSpool.Web/package.json
          cache: npm
          cache-dependency-path: src/ShutterSpool.Web/package-lock.json
      - name: Install Aspire CLI
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/aspire" Aspire.Cli --version 13.6.0
          echo "$RUNNER_TEMP/aspire" >> "$GITHUB_PATH"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
          checksum: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
      - name: Build once
        run: >-
          python tools/build-release.py --version "$BUILD_VERSION" --revision "$BUILD_REVISION"
          --output "$RUNNER_TEMP/candidate"
      - name: Store image and Compose bundle privately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$ACTOR" --password-stdin
          image=$(jq -er '.serverImage.digest' candidate/release-manifest.json)
          # Keep the original build manifest; its OCI archive is stored separately.
          tar --exclude=server-image.oci.tar -czf shutterspool-release-bundle.tar.gz -C candidate .
          oras cp --from-oci-layout "candidate/server-image.oci.tar@$image" "$PACKAGE:candidate-$RUN_ID-$ATTEMPT-image"
          test "$(oras resolve "$PACKAGE:candidate-$RUN_ID-$ATTEMPT-image")" = "$image"
          oras push "$PACKAGE:candidate-$RUN_ID-$ATTEMPT-bundle" \
            --artifact-type application/vnd.shutterspool.release.bundle \
            --annotation "org.opencontainers.image.version=$BUILD_VERSION" \
            --annotation "org.opencontainers.image.revision=$BUILD_REVISION" \
            --annotation "io.shutterspool.image.digest=$image" \
            shutterspool-release-bundle.tar.gz:application/gzip
          bundle=$(oras resolve "$PACKAGE:candidate-$RUN_ID-$ATTEMPT-bundle")
          {
            printf 'Version: `%s`\nSource: `%s`\n' "$BUILD_VERSION" "$BUILD_REVISION"
            printf 'Image: `%s@%s`\nBundle: `%s@%s`\n' "$PACKAGE" "$image" "$PACKAGE" "$bundle"
            printf '\nQualify these artifacts before requesting promotion.\n'
          } >> "$GITHUB_STEP_SUMMARY"

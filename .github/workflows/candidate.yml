name: Stage private container candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Explicit SemVer prerelease candidate version
        required: true
        type: string
      revision:
        description: Exact 40-character commit SHA to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ghcr-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare-and-stage:
    if: github.repository == 'SeWieland/ShutterSpool' && github.ref == 'refs/heads/main' && vars.GHCR_CANDIDATE_STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      BUILD_REVISION: ${{ inputs.revision }}
      BUILD_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate selected revision input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REVISION }}
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - name: Check selected revision is on main
        env:
          BUILD_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$BUILD_REVISION" origin/main
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/ShutterSpool.Web/package.json
          cache: npm
          cache-dependency-path: src/ShutterSpool.Web/package-lock.json
      - name: Install Aspire CLI
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/aspire" Aspire.Cli --version 13.6.0
          echo "$RUNNER_TEMP/aspire" >> "$GITHUB_PATH"
      - name: Set up local Buildx builder
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
          checksum: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
      - name: Verify release builder
        run: python tests/verify-release-build.py
      - name: Verify GHCR candidate publication controls
        run: python tests/verify-ghcr-publication.py
      - name: Test supplied camera certificate validation
        run: python tests/verify-edge-startup.py
      - name: Prepare local candidate artifacts
        shell: bash
        run: >-
          python tools/build-release.py
          --version "$BUILD_VERSION"
          --revision "$BUILD_REVISION"
          --output "$RUNNER_TEMP/shutterspool-candidate"
      - name: Create the unchanged distribution bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          python tools/ghcr-publication.py bundle \
            --candidate "$RUNNER_TEMP/shutterspool-candidate" \
            --output "$RUNNER_TEMP/shutterspool-release-bundle.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Require the existing private candidate package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          visibility="$(gh api /user/packages/container/shutterspool-candidates --jq .visibility)"
          test "$visibility" = private
      - name: Log in to private candidate package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Stage image and release bundle
        id: stage
        env:
          CANDIDATE: ${{ runner.temp }}/shutterspool-candidate
          IMAGE_ARCHIVE: ${{ runner.temp }}/shutterspool-candidate/server-image.oci.tar
          CANDIDATE_PACKAGE: ghcr.io/sewieland/shutterspool-candidates
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          image_tag="candidate-${RUN_ID}-${RUN_ATTEMPT}-image"
          bundle_tag="candidate-${RUN_ID}-${RUN_ATTEMPT}-bundle"
          expected_image="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["serverImage"]["digest"])' "$CANDIDATE/release-manifest.json")"
          image_digest="$(oras cp --from-oci-layout "$IMAGE_ARCHIVE@$expected_image" "$CANDIDATE_PACKAGE:$image_tag" >/dev/null && oras resolve "$CANDIDATE_PACKAGE:$image_tag")"
          test "$image_digest" = "$expected_image"
          bundle_digest="$(oras push --artifact-type application/vnd.shutterspool.release.bundle "$CANDIDATE_PACKAGE:$bundle_tag" shutterspool-release-bundle.tar.gz:application/vnd.shutterspool.release.bundle.v1.tar+gzip --format go-template='{{.digest}}')"
          [[ "$bundle_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "bundle_tag=$bundle_tag" >> "$GITHUB_OUTPUT"
          echo "bundle_digest=$bundle_digest" >> "$GITHUB_OUTPUT"
      - name: Verify staged candidate from private GHCR
        env:
          CANDIDATE_PACKAGE: ghcr.io/sewieland/shutterspool-candidates
          IMAGE_TAG: ${{ steps.stage.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.stage.outputs.image_digest }}
          BUNDLE_TAG: ${{ steps.stage.outputs.bundle_tag }}
          BUNDLE_DIGEST: ${{ steps.stage.outputs.bundle_digest }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.bundle_sha256 }}
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_REVISION: ${{ inputs.revision }}
          PULLED: ${{ runner.temp }}/candidate-stage-verify
          PULLED_IMAGE: ${{ runner.temp }}/candidate-image-verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(oras resolve "$CANDIDATE_PACKAGE:$IMAGE_TAG")" = "$IMAGE_DIGEST"
          test "$(oras resolve "$CANDIDATE_PACKAGE:$BUNDLE_TAG")" = "$BUNDLE_DIGEST"
          oras cp --to-oci-layout "$CANDIDATE_PACKAGE@$IMAGE_DIGEST" "$PULLED_IMAGE:$BUILD_VERSION"
          python tools/ghcr-publication.py verify-image --layout "$PULLED_IMAGE" --image-digest "$IMAGE_DIGEST" --require-attestations
          oras pull --output "$PULLED" "$CANDIDATE_PACKAGE@$BUNDLE_DIGEST"
          test "$(sha256sum "$PULLED/shutterspool-release-bundle.tar.gz" | cut -d' ' -f1)" = "$BUNDLE_SHA256"
          python tools/ghcr-publication.py verify \
            --bundle "$PULLED/shutterspool-release-bundle.tar.gz" \
            --version "$BUILD_VERSION" --commit "$BUILD_REVISION" --image-digest "$IMAGE_DIGEST"
          {
            printf 'Private candidate is staged and verified.\n\n'
            printf 'Image: `%s@%s`\n' "$CANDIDATE_PACKAGE" "$IMAGE_DIGEST"
            printf 'Image tag: `%s`\n' "$IMAGE_TAG"
            printf 'Bundle: `%s@%s`\n' "$CANDIDATE_PACKAGE" "$BUNDLE_DIGEST"
            printf 'Bundle tag: `%s`\n' "$BUNDLE_TAG"
            printf 'Source: `%s`\n' "$BUILD_REVISION"
          } >> "$GITHUB_STEP_SUMMARY"

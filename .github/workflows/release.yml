name: Publish tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  REPOSITORY: ${{ github.repository }}
  IMAGE: ghcr.io/sewieland/shutterspool

jobs:
  preflight:
    if: github.repository == 'SeWieland/ShutterSpool'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a valid version, source on main and successful CI
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          commit=$(git rev-parse HEAD)
          version=${RELEASE_TAG#v}
          prerelease=$(python -c 'import runpy,sys; print(str(runpy.run_path("tools/build-release.py")["is_prerelease"](sys.argv[1])).lower())' "$version")
          for workflow in CI CodeQL; do
            test "$(gh run list --repo "$REPOSITORY" --workflow "$workflow" --commit "$commit" --branch main --limit 1 --json conclusion --jq '.[0].conclusion')" = success
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - name: Check out the verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
          lfs: true
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing versions and create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api "repos/$REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$COMMIT"
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft 2>"$RUNNER_TEMP/release-error" > /dev/null; then
            echo 'Release already exists; inspect it manually.' >&2; exit 1
          fi
          grep -Fxq 'release not found' "$RUNNER_TEMP/release-error" || { cat "$RUNNER_TEMP/release-error" >&2; exit 1; }
          if docker manifest inspect "$IMAGE:$VERSION" 2>"$RUNNER_TEMP/registry-error" > /dev/null; then
            echo 'Container version already exists; refusing replacement.' >&2; exit 1
          fi
          grep -Fxq -e "no such manifest: $IMAGE:$VERSION" -e 'manifest unknown' "$RUNNER_TEMP/registry-error" || { cat "$RUNNER_TEMP/registry-error" >&2; exit 1; }
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --draft --prerelease="$PRERELEASE" --generate-notes \
            --notes 'Fresh installations only. Upgrades from earlier releases are not supported; back up existing data before replacing an installation.'
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build and push Server image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Server.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sewieland/shutterspool:${{ needs.preflight.outputs.version }}
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
            COMMIT=${{ needs.preflight.outputs.commit }}
          provenance: true
          sbom: true
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install Aspire CLI
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/aspire" Aspire.Cli --version 13.6.0
          echo "$RUNNER_TEMP/aspire" >> "$GITHUB_PATH"
      - name: Set up Node.js for attribution generation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/ShutterSpool.Web/package.json
      - name: Package Compose ZIP and checksum
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: >-
          python tools/build-release.py --version "$VERSION" --revision "$COMMIT"
          --image-digest "$IMAGE_DIGEST" --output "$RUNNER_TEMP/release"
      - name: Retain available package outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Attach assets, check anonymous access and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" \
            "$RUNNER_TEMP/release/shutterspool-compose.zip" "$RUNNER_TEMP/release/shutterspool-compose.zip.sha256"
          mkdir "$RUNNER_TEMP/anonymous-docker"
          docker --config "$RUNNER_TEMP/anonymous-docker" manifest inspect "$IMAGE@$IMAGE_DIGEST" > /dev/null
          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false --prerelease="$PRERELEASE"
          echo "Published $RELEASE_TAG with $IMAGE:$VERSION@$IMAGE_DIGEST and Compose assets." >> "$GITHUB_STEP_SUMMARY"

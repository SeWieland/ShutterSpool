services:
  proxy:
    image: traefik:v3.6.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    restart: unless-stopped
    stop_grace_period: 150s
    networks: [proxy, identity-proxy]
    ports:
      - ${HTTPS_LISTEN_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443
    command: [--entrypoints.websecure.address=:443, --providers.file.directory=/etc/traefik/dynamic, --providers.file.watch=true, --api=false, --accesslog=false, --log.level=ERROR]
    volumes:
      - ./package/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./package/traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - ./certificates:/run/certificates:ro
    depends_on:
      server:
        condition: service_healthy

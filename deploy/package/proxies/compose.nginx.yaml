services:
  proxy:
    image: nginx:1.31.8-trixie@sha256:165ddde8751e75a1c907d24ef10d9f6deb08b57e0fe56caf67512486aff76d82
    restart: unless-stopped
    stop_grace_period: 150s
    networks: [proxy, identity-proxy]
    ports:
      - ${HTTPS_LISTEN_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certificates:/run/certificates:ro
    depends_on:
      server:
        condition: service_healthy

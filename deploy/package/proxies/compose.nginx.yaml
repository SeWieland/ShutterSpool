services:
  proxy:
    image: nginx:1.30.7-trixie@sha256:7fad6c0dff97965adbddf28027d934b111fc0221a554315dc274712f3fba24d3
    restart: unless-stopped
    stop_grace_period: 150s
    networks: [proxy, identity-proxy]
    ports:
      - ${HTTPS_LISTEN_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certificates:/run/certificates:ro
    depends_on:
      server:
        condition: service_healthy
